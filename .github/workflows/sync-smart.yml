name: Sync Smart Wallets Daily

on:
  schedule:
    - cron: '0 4 * * *' # 每天北京时间中午 12:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Browser
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Crawler and Save to Repo
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            console.log("正在启动无头 Chrome 浏览器穿透 5 秒盾...");
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            });
            const page = await context.newPage();

            console.log("打开 GMGN 首页激活安全通行证...");
            try {
              await page.goto("https://gmgn.ai/?chain=sol", { waitUntil: "domcontentloaded", timeout: 30000 });
              await page.waitForTimeout(6000);
            } catch (e) {
              console.log("主页载入提示:", e.message);
            }

            const chains = ["sol", "bsc", "base"];
            const apiKey = "gmgn_ced5d8c6532c29d0c4b6094be8775275";
            let aggregated = [];

            for (const c of chains) {
              const targetUrl = `https://gmgn.ai/defi/quotation/v1/rank/${c}/wallets/30d?orderby=pnl&limit=30`;
              try {
                const result = await page.evaluate(async ({ url, key }) => {
                  const resp = await fetch(url, {
                    headers: { "X-APIKEY": key, "Accept": "application/json" }
                  });
                  return resp.ok ? await resp.json() : { error: resp.status };
                }, { url: targetUrl, key: apiKey });

                const list = result?.data?.rank || result?.rank || [];
                for (const w of list) {
                  const rawRate = w.winRate ?? w.win_rate ?? w.winrate ?? 0.6;
                  const rateNum = Number(String(rawRate).replace("%", ""));
                  const rate = rateNum > 1 ? rateNum / 100 : rateNum;
                  const addr = (w.wallet_address || w.address || "").toLowerCase();

                  if (addr) {
                    aggregated.push({
                      chain: c.toUpperCase(),
                      address: addr,
                      alias: w.twitter_username ? `@${w.twitter_username}` : `${addr.slice(0, 4)}...${addr.slice(-4)}`,
                      pnl30d: Math.round(Number(w.pnl ?? w.pnl_30d ?? 0)),
                      winRate: `${Math.round(rate * 100)}%`,
                      profitUsd: Math.round(Number(w.realized_profit ?? 0))
                    });
                  }
                }
                console.log(`[${c}] 成功抓取: ${list.length} 个作手`);
              } catch (e) {
                console.log(`[${c}] 异常: ${e.message}`);
              }
            }

            await browser.close();

            if (aggregated.length > 0) {
              aggregated.sort((a, b) => b.pnl30d - a.pnl30d);
              const top50 = aggregated.slice(0, 50);
              fs.writeFileSync("smart_wallets.json", JSON.stringify(top50, null, 2));
              console.log(`成功将 Top ${top50.length} 作手落盘至 smart_wallets.json`);
            } else {
              console.log("抓取为空，保持原文件不变");
            }
          })();
          '

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add smart_wallets.json
          git commit -m "chore: auto sync top 50 smart wallets [skip ci]" || echo "无变动，跳过提交"
          git push
