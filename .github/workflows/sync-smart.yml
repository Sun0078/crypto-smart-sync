name: Sync Smart Wallets Daily

on:
  schedule:
    - cron: '0 4 * * *' # 每天北京时间中午 12:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Browser
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Real Browser Crawler
        env:
          # 务必把下面这行替换为你的真实 Worker 域名（保留 /import-smart）：
          WORKER_URL: "https://arc-master-radar.ldmhx7758521.workers.dev/import-smart"
        run: |
          node -e '
          const { chromium } = require("playwright");

          (async () => {
            const workerUrl = process.env.WORKER_URL;
            console.log("正在启动无头 Chrome 浏览器穿透 5 秒盾...");
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            });
            const page = await context.newPage();

            // 1. 访问主站让浏览器自主跑通 Cloudflare 验证
            console.log("打开 GMGN 首页激活安全通行证...");
            try {
              await page.goto("https://gmgn.ai/?chain=sol", { waitUntil: "domcontentloaded", timeout: 30000 });
              await page.waitForTimeout(6000); // 等待盾自动通过
            } catch (e) {
              console.log("主页载入提示:", e.message);
            }

            const chains = ["sol", "bsc", "base"];
            const apiKey = "gmgn_ced5d8c6532c29d0c4b6094be8775275";
            let aggregated = [];

            // 2. 利用已获得通行凭证的真实浏览器上下文请求数据
            for (const c of chains) {
              const targetUrl = `https://gmgn.ai/defi/quotation/v1/rank/${c}/wallets/30d?orderby=pnl&limit=30`;
              try {
                const result = await page.evaluate(async ({ url, key }) => {
                  const resp = await fetch(url, {
                    headers: { "X-APIKEY": key, "Accept": "application/json" }
                  });
                  return resp.ok ? await resp.json() : { error: resp.status };
                }, { url: targetUrl, key: apiKey });

                const list = result?.data?.rank || result?.rank || [];
                for (const w of list) {
                  aggregated.push({ ...w, chain: c.toUpperCase() });
                }
                console.log(`[${c}] 成功穿透并拉取: ${list.length} 个优质作手`);
              } catch (e) {
                console.log(`[${c}] 异常: ${e.message}`);
              }
            }

            await browser.close();

            // 3. 将聚合的 Top 50 结果推送写入 Cloudflare Worker KV
            if (aggregated.length > 0) {
              console.log(`准备将 ${aggregated.length} 个最新作手推回 Worker...`);
              const pushRes = await fetch(workerUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(aggregated)
              });
              console.log("Worker 接收响应:", await pushRes.text());
            } else {
              console.log("本次抓取受限，Worker 自动保持内置种子库运行。");
            }
          })();
          '
